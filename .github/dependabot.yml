# ═══════════════════════════════════════════════════════════
# AGRIAGENT — Configuration Dependabot (mises à jour de version)
# ═══════════════════════════════════════════════════════════
# Ce fichier ne pilote QUE les mises à jour de version. Les alertes
# de vulnérabilité et les mises à jour de sécurité sont activées au
# niveau du dépôt et ne dépendent pas de lui.
#
# Écosystème "github-actions" volontairement retiré : il échouait à
# chaque exécution ("/action.yml or /.github/workflows/<anything>.yml
# not found") car le dépôt ne contient aucun workflow.
# À réintroduire en même temps que le premier workflow.
#
# Écosystème "pip" : lit requirements.txt à la racine du dépôt.

version: 2
updates:
  # ── Python (pip) ─────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
