# ═══════════════════════════════════════════════════════════
# AGRIAGENT — Configuration Dependabot (mises à jour de version)
# ═══════════════════════════════════════════════════════════
# Ce fichier ne pilote QUE les mises à jour de version. Les alertes
# de vulnérabilité et les mises à jour de sécurité sont activées au
# niveau du dépôt et ne dépendent pas de lui.
#
# Écosystème "pip" : lit requirements.txt à la racine du dépôt.
# Écosystème "github-actions" : lit .github/workflows/securite.yml ;
# il met à jour les actions épinglées à un SHA complet.

version: 2
updates:
  # ── Python (pip) ─────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"

  # ── GitHub Actions ───────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "actions"
      include: "scope"
