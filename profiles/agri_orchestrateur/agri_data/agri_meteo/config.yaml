# ═══════════════════════════════════════════════════════════
# AGRIAGENT — Profil : MeteoAgent
# ═══════════════════════════════════════════════════════════
# Rôle : collecter la météo (Open-Meteo), calculer
# heures_rh_90, écrire dans meteo_releves.

model:
  default: deepseek-flash
  provider: deepseek
  base_url: https://api.deepseek.com/v1

agent:
  max_turns: 150

web:
  backend: ddgs
  extract_backend: tavily

display:
  tool_progress: all

plugins:
  enabled: []

_config_version: 45

platform_toolsets:
  cli:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - web

mcp_servers:
  supabase:
    url: https://mcp.supabase.com/mcp
    auth: oauth
    oauth:
      timeout: 900
